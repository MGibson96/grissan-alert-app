# Site -> customer -> contact mapping.
#
# Keyed by the "Site" field from the OEM alarm email (e.g. "Grissan").
# Optionally, a site can define per-machine overrides under "machines" if
# different machines at the same site need different contacts — otherwise
# every alarm for that site goes to the site-level emails/phones.
#
# Phone numbers must be in E.164 format (e.g. +15551234567) for AWS SNS.
#
# This is a placeholder — replace with the real site(s) and contacts.
# emails/phones below point at a personal test inbox/number for now so you
# can see the dispatch working end-to-end; swap for real customer contacts
# before this goes live.

sites:
  "Grissan - Carrick":
    customer: Grissan
    emails:
      - mjsgibson1@gmail.com
    phones:
      - "+15551234567"
